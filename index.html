<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MameV2Ray PWA</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #0f172a; color: #fff; }
        .container { max-width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #22c55e; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>MameV2Ray Client</h2>
        <p>Optimize your network connection</p>
        <input type="text" id="vless" placeholder="Paste V2Ray / VLESS link here">
        <button onclick="connect()">Connect</button>
    </div>
    <script>
        function connect() {
            alert("Configuration saved for network optimization!");
        }
    </script>
</body>
</html>
